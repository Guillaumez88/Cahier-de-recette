name: Déployer sur GitHub Pages

# Le carnet est un site statique sans dépendance ni étape de construction : le job
# joue les tests de la logique métier, puis publie le dossier recipe-app/ tel quel.
#
# Ce fichier doit rester à la racine du dépôt : GitHub Actions ne lit les workflows
# que dans .github/workflows/ à la racine, jamais dans un sous-dossier de projet.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Aucun npm install : le projet n'a pas de dépendance, les tests tournent
      # sous Node pur. Les tests navigateur ne sont pas joués ici, ils demandent
      # une installation de Playwright (voir le README).
      - name: Tests de la logique métier
        run: node tests/run-tests.js
        working-directory: recipe-app

      # Ces tests n'appellent jamais le vrai Firebase : ils lancent l'émulation
      # de tests/stub-firestore.js sur un port local.
      - name: Tests de la synchronisation de la liste commune
        run: node tests/run-sync-tests.js
        working-directory: recipe-app

      - name: Vérifier que le site est complet
        run: |
          cd recipe-app
          for f in index.html favicon.svg css/style.css js/logic.js js/quantites.js js/rayons.js js/sync.js js/recettes.js js/storage.js js/firebase-config.js js/app.js data/recipes.json; do
            test -f "$f" || { echo "manquant : $f"; exit 1; }
          done
          node -e "const r=require('./data/recipes.json'); if(r.length!==17) throw new Error(r.length+' recettes au lieu de 17'); console.log(r.length+' recettes')"

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Uploader le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: recipe-app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
