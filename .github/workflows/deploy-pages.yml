name: Déployer sur GitHub Pages

# Le dépôt contient deux versions de l'application :
#   recipe-app-native/  v2 Expo (mobile + export web)  -> publiée à la racine du site
#   recipe-app/         v1 web statique                -> publiée sous /classique/
# Les deux partagent le même jeu de 17 recettes ; le job vérifie qu'elles ne
# divergent pas avant de construire.
#
# Ce fichier doit rester à la racine du dépôt : GitHub Actions ne lit les workflows
# que dans .github/workflows/ à la racine, jamais dans un sous-dossier de projet.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipe-app-native
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: recipe-app-native/package-lock.json

      # npm ci et non npm install : le package-lock.json est committé, les versions
      # installées en CI sont donc exactement celles testées en local.
      - name: Installer les dépendances
        run: npm ci

      - name: Tests de la logique métier et synchronisation des deux versions
        run: npm test

      - name: Exporter la version web (Metro, monopage + repli 404.html)
        run: npm run export:web

      # La v1 est un site statique sans build : tous ses chemins sont relatifs, elle
      # fonctionne donc telle quelle depuis un sous-dossier.
      - name: Ajouter la v1 web sous /classique/
        run: cp -r ../recipe-app dist/classique

      - name: Vérifier que l'export contient bien les deux versions
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/favicon.svg
          test -f dist/classique/index.html
          test -f dist/classique/data/recipes.json
          echo "Contenu de dist/ :"
          ls -la dist

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Uploader l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: recipe-app-native/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
