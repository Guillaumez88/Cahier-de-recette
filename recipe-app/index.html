<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miam miam !</title>
    <meta
      name="description"
      content="Carnet personnel de recettes : recherche, filtres, fiches détaillées et liste de courses."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icones/apple-touch-icon.png" />
    <meta name="theme-color" content="#c67139" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Miam miam" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Ecran de demarrage. Il est dans le HTML et non construit par app.js : il doit
         etre peint au tout premier rendu, avant que le moindre script ne tourne, sinon
         il arriverait apres ce qu'il est cense couvrir.

         Il ne peut pas rester coince : app.js le retire des le premier ecran monte, et
         une animation CSS le fait disparaitre au bout de 4 secondes meme si aucun
         script ne tourne. Un ecran de demarrage qui bloque vaut moins que pas d'ecran
         du tout. -->
    <div class="demarrage" id="demarrage" role="status" aria-label="Chargement de Miam miam !">
      <div class="demarrage__marque">
        <img class="demarrage__logo" src="favicon.svg" alt="" width="96" height="96" />
        <p class="demarrage__nom">Miam miam !</p>
        <p class="demarrage__note">Le carnet de la maison</p>
      </div>
      <div class="demarrage__jauge" aria-hidden="true"><span></span></div>
    </div>

    <a class="lien-evitement" href="#contenu">Aller au contenu</a>

    <header class="entete">
      <div class="conteneur entete__interieur">
        <a class="marque" href="#/">
          <span class="marque__trait" aria-hidden="true"></span>
          <span>Miam miam !</span>
        </a>
        <!-- Navigation et rafraichissement sont construits par app.js : ils portent
             des pictogrammes SVG et un etat qui changent avec les donnees. -->
        <nav class="entete__nav" id="nav-entete" aria-label="Navigation principale"></nav>
      </div>
    </header>

    <main class="conteneur" id="contenu">
      <!-- Un seul point de montage : le routage par ancre remplace ce contenu.

           Pas d'aria-live ici : cette zone porte l'ecran entier, et un lecteur
           d'ecran relisait donc toute la page a chaque navigation. L'annonce se
           fait par #annonce, plus bas, qui ne porte qu'une phrase. -->
      <div id="vue">
        <p class="etat-chargement">Chargement des recettes…</p>
      </div>
    </main>

    <!-- Zone d'annonce pour les lecteurs d'ecran : une phrase par navigation
         (« Liste de courses, 14 articles »), invisible a l'oeil. Une zone aria-live
         doit envelopper un message d'etat, jamais l'application entiere. -->
    <p class="hors-ecran" id="annonce" role="status" aria-live="polite"></p>

    <!-- Barre d'onglets, sur mobile uniquement. Trois destinations, le pouce en bas
         de l'ecran : c'est la convention des applications, et l'en-tete n'a plus a
         porter de liens sur un ecran etroit. -->
    <nav class="onglets-mobile" id="onglets-mobile" aria-label="Navigation"></nav>

    <!-- Ordre significatif : chaque script consomme les precedents.
         firebase-config.js -> sync.js -> storage.js / semainier.js / photos.js -> app.js -->
    <script src="js/firebase-config.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/quantites.js"></script>
    <script src="js/rayons.js"></script>
    <script src="js/flux.js"></script>
    <script src="js/semaine.js"></script>
    <script src="js/icones.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/recettes.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/semainier.js"></script>
    <script src="js/placard.js"></script>
    <script src="js/photos.js"></script>
    <script src="js/cuisson.js"></script>
    <script src="js/vue-magasin.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
