<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miam miam !</title>
    <meta
      name="description"
      content="Carnet personnel de recettes : recherche, filtres, fiches détaillées et liste de courses."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="lien-evitement" href="#contenu">Aller au contenu</a>

    <header class="entete">
      <div class="conteneur entete__interieur">
        <a class="marque" href="#/">
          <span class="marque__trait" aria-hidden="true"></span>
          <span>Miam miam !</span>
        </a>
        <!-- Navigation et rafraichissement sont construits par app.js : ils portent
             des pictogrammes SVG et un etat qui changent avec les donnees. -->
        <nav class="entete__nav" id="nav-entete" aria-label="Navigation principale"></nav>
      </div>
    </header>

    <main class="conteneur" id="contenu">
      <!-- Un seul point de montage : le routage par ancre remplace ce contenu. -->
      <div id="vue" aria-live="polite">
        <p class="etat-chargement">Chargement des recettes…</p>
      </div>
    </main>

    <!-- Barre d'onglets, sur mobile uniquement. Trois destinations, le pouce en bas
         de l'ecran : c'est la convention des applications, et l'en-tete n'a plus a
         porter de liens sur un ecran etroit. -->
    <nav class="onglets-mobile" id="onglets-mobile" aria-label="Navigation"></nav>

    <footer class="pied">
      <div class="conteneur">
        <p>
          Recettes rassemblées depuis leurs sites d'origine, chaque fiche cite sa source. Usage
          personnel.
        </p>
      </div>
    </footer>

    <!-- Ordre significatif : chaque script consomme les precedents.
         firebase-config.js -> sync.js -> storage.js / semainier.js / photos.js -> app.js -->
    <script src="js/firebase-config.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/quantites.js"></script>
    <script src="js/rayons.js"></script>
    <script src="js/flux.js"></script>
    <script src="js/semaine.js"></script>
    <script src="js/icones.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/recettes.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/semainier.js"></script>
    <script src="js/photos.js"></script>
    <script src="js/cuisson.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
