     site reel : l'environnement de developpement n'a pas acces a internet. -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tarte aux pommes de mamie</title>
<script type="application/ld+json">
{ "@context": "https://schema.org", "@type": "Organization", "name": "Le site" }
</script>
<script type="application/ld+json">{ ceci n'est pas du JSON }</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    { "@type": "WebSite", "name": "Le site de cuisine" },
    {
      "@type": ["Recipe", "NewsArticle"],
      "name": "Tarte aux pommes de mamie",

        { "@type": "HowToStep", "text": "Pr&eacute;chauffer le four &agrave; 180 &deg;C." },

</head>
